name: Sync and Rewrite Commits

on:
  schedule:
    - cron: '18 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout _sync branch
        uses: actions/checkout@v6
        with:
          ref: _sync
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv venv && uv pip install git-filter-repo

      - name: Configure Git
        run: |
          git config --global user.name "Ivan Gabriele"
          git config --global user.email "ivan.gabriele@protonmail.com"

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          ./scripts/sync.sh --push --verbose

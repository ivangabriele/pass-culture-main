name: Sync

on:
  workflow_dispatch:

jobs:
  sync:
    name: Sync
    if: github.ref == 'refs/heads/_sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout _sync branch
        uses: actions/checkout@v6
        with:
          ref: _sync
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv venv && uv pip install git-filter-repo

      - name: Configure Git
        run: |
          git config --global user.name "Ivan Gabriele"
          git config --global user.email "ivan.gabriele@protonmail.com"

      - name: Run sync script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          ./scripts/sync.sh --push --verbose
